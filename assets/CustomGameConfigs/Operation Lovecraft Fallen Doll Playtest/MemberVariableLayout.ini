; Operation Lovecraft: Fallen Doll Playtest, UE 5.7.4 custom FProperty layout.
; The game adds eight bytes between RepIndex and Offset_Internal. Every field
; at or after Offset_Internal, including fields in derived property classes,
; is therefore shifted by eight bytes from the stock UE 5.7 layout.

[FProperty]
ArrayDim = 0x30
ElementSize = 0x34
PropertyFlags = 0x38
RepIndex = 0x40
Offset_Internal = 0x48
PropertyLinkNext = 0x50
NextRef = 0x58
DestructorLinkNext = 0x60
PostConstructLinkNext = 0x68
RepNotifyFunc = 0x70
UEP_TotalSize = 0x78

[FObjectPropertyBase]
PropertyClass = 0x78
UEP_TotalSize = 0x80

[FStructProperty]
Struct = 0x78
UEP_TotalSize = 0x80

[FArrayProperty]
ArrayFlags = 0x78
Inner = 0x80
UEP_TotalSize = 0x88

[FMapProperty]
KeyProp = 0x78
ValueProp = 0x80
MapLayout = 0x88
MapFlags = 0xA0
UEP_TotalSize = 0xA8

[FSetProperty]
ElementProp = 0x78
SetLayout = 0x80
UEP_TotalSize = 0x98

[FBoolProperty]
FieldSize = 0x78
ByteOffset = 0x79
ByteMask = 0x7A
FieldMask = 0x7B
UEP_TotalSize = 0x80

[FByteProperty]
Enum = 0x78
UEP_TotalSize = 0x80

[FEnumProperty]
UnderlyingProp = 0x78
Enum = 0x80
UEP_TotalSize = 0x88

[FClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FSoftClassProperty]
MetaClass = 0x80
UEP_TotalSize = 0x88

[FDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FMulticastDelegateProperty]
SignatureFunction = 0x78
UEP_TotalSize = 0x80

[FInterfaceProperty]
InterfaceClass = 0x78
UEP_TotalSize = 0x80

[FFieldPathProperty]
PropertyClass = 0x78
UEP_TotalSize = 0x80
